name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen project.zip (neu co)
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi
          ls -R lib | head -n 80

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Tao thu muc android
        run: |
          flutter create --org com.binhdt --project-name photo_editor --platforms android /tmp/base
          rm -rf android
          cp -r /tmp/base/android ./android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application android:requestLegacyExternalStorage="true"|' $M
          sed -i 's|android:label="photo_editor"|android:label="Photo Editor"|' $M
          cat $M

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: photo-editor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
